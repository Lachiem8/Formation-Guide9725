
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Formation Tool" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <meta name="theme-color" content="#1e3a8a" />

  <link rel="apple-touch-icon" href="homescreenimage.png" />
  <link rel="icon" type="image/png" href="tabicon.png" />

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <title>Group Photo Formation Tool</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #1e3a8a;
    }

    body {
      margin: 0;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: 0.75rem;
      padding-right: 0.75rem;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;

      font-family: "Montserrat", sans-serif;

      background: linear-gradient(
        135deg,
        #1e3a8a 0%,
        #0f172a 110%
      );

      color: white;
      overflow-x: hidden;
    }

    .logo {
      width: 180px;
      max-width: 70vw;
      margin-top: 1.25rem;
      margin-bottom: 1rem;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
    }

    .container {
      width: 100%;
      max-width: 560px;

      background: #1e293b;

      padding: 1.5rem;

      border-radius: 16px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.3);

      text-align: center;
    }

    h1 {
      margin: 0 0 1.25rem 0;

      font-size: 1.45rem;
      line-height: 1.25;

      font-weight: 700;

      color: #60a5fa;

      white-space: nowrap;
    }

    #studentCount {
      width: 100%;

      padding: 0.9rem 1rem;

      border: none;
      border-radius: 10px;

      background: #f8fafc;
      color: #111827;

      font-family: "Montserrat", sans-serif;
      font-size: 1rem;
      font-weight: 500;

      text-align: center;

      outline: none;

      -webkit-appearance: none;
      appearance: none;
    }

    #studentCount::placeholder {
      color: #64748b;
      opacity: 1;
    }

    #studentCount:focus {
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.35);
    }

    #clearButton {
      display: none;

      margin: 0.7rem auto 0;

      padding: 0.75rem 1.5rem;

      border: none;
      border-radius: 10px;

      background: #475569;
      color: white;

      font-family: "Montserrat", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    #clearButton:active {
      transform: scale(0.97);
    }

    #result {
      margin-top: 1.25rem;

      min-height: 1.5rem;

      font-size: 1.05rem;
      line-height: 1.7;

      font-weight: 500;

      white-space: pre-wrap;
    }

    .underline {
      text-decoration: underline;
      font-weight: 700;
    }

    .home-screen {
      margin-top: 1.25rem;

      font-size: 0.82rem;
      line-height: 1.5;

      color: #cbd5e1;
    }

    .home-screen strong {
      color: white;
    }

    .share-icon {
      height: 18px;
      width: auto;

      vertical-align: middle;

      margin: 0 3px;
    }

    footer {
      margin-top: auto;
      padding-top: 1.5rem;
      padding-bottom: 1rem;

      font-size: 0.72rem;

      color: rgba(255, 255, 255, 0.55);

      text-align: center;
    }

    @media (max-width: 380px) {
      .container {
        padding: 1.25rem;
      }

      h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>

  <img
    src="Leading Image drop shadow.png"
    alt="Leading Image"
    class="logo"
  />

  <div class="container">

    <h1>Group Photo Formation Tool</h1>

    <input
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      id="studentCount"
      placeholder="Tap to enter total number of subjects"
      autocomplete="off"
      autofocus
    />

    <button id="clearButton" onclick="clearFormation()">
      Clear
    </button>

    <div id="result"></div>

    <div class="home-screen">
      📱 <strong>Add this tool to your iPhone Home Screen</strong><br />
      Tap Share
      <img
        src="share-icon.png"
        alt="Share"
        class="share-icon"
      />
      then scroll down and tap
      <strong>"Add to Home Screen"</strong>.<br />
      Tap <strong>Add</strong> in the top-right corner.
    </div>

  </div>

  <footer>
    Made by Lachlan Inns
  </footer>


  <script>
    const predefinedFormations = {
      9: [5, 4],
      10: [5, 5],
      11: [6, 5],
      12: [6, 6],
      13: [5, 4, 4],
      14: [5, 4, 5],
      15: [6, 5, 4],
      16: [6, 5, 5],
      17: [6, 5, 6],
      18: [7, 6, 5],
      19: [7, 6, 6],
      20: [7, 6, 7],
      21: [7, 5, 5, 4],
      22: [7, 6, 5, 4],
      23: [7, 6, 5, 5],
      24: [7, 6, 5, 6],
      25: [7, 6, 6, 6],
      26: [7, 6, 6, 7],
      27: [7, 6, 7, 7],
      28: [8, 7, 6, 7],
      29: [8, 7, 7, 7],
      30: [8, 7, 8, 7],
      31: [8, 7, 8, 8],
      32: [9, 8, 7, 8],
      33: [9, 8, 8, 8],
      34: [9, 8, 9, 8],
      35: [9, 8, 9, 9],
      36: [10, 9, 8, 9],
      37: [10, 9, 9, 9],
      38: [10, 9, 10, 9],
      39: [10, 9, 8, 7, 7],
      40: [10, 9, 8, 8, 8],
      41: [9, 8, 7, 8, 9],
      42: [10, 9, 8, 7, 8],
      43: [10, 9, 8, 8, 8],
      44: [10, 9, 8, 9, 8]
    };


    function getRowCount(count) {
      if (count >= 161) return 10;
      if (count >= 131) return 9;
      if (count >= 101) return 8;
      if (count >= 80) return 7;
      if (count >= 66) return 6;
      if (count >= 45) return 5;

      return null;
    }


    function calculateFormation() {

      const input = document.getElementById("studentCount");
      const resultEl = document.getElementById("result");
      const clearButton = document.getElementById("clearButton");

      // Only allow numbers
      input.value = input.value.replace(/[^0-9]/g, "");

      const count = parseInt(input.value);

      // Show/hide Clear button
      clearButton.style.display = input.value ? "block" : "none";

      // Empty field
      if (!input.value || !count) {
        resultEl.innerHTML = "";
        return;
      }

      // 8 or fewer = all standing
      if (count <= 8) {
        resultEl.innerHTML =
          `<span class="underline">All Standing</span>`;
        return;
      }

      // Predefined formations
      if (predefinedFormations[count]) {

        const formation = predefinedFormations[count];

        resultEl.innerHTML =
          `<span class="underline">${formation.length} Rows</span>` +
          `\nFormation: ${formation.join(" - ")}`;

        return;
      }

      // Formation for larger groups
      let rowCount;

      if (count > 194) {
        rowCount = 11;
      } else {
        rowCount = getRowCount(count);
      }

      if (!rowCount) {

        resultEl.innerText =
          "Please enter a number between 9 and 161+";

        return;
      }

      const avg = count / rowCount;
      const avgDisplay = avg.toFixed(2);

      let high = Math.round(avg);
      let low = high - 1;

      let formation = [];

      for (let i = 0; i < rowCount; i++) {
        formation.push(
          i % 2 === 0 ? high : low
        );
      }

      let total = formation.reduce(
        (a, b) => a + b,
        0
      );

      let scanIns = count - total;

      while (scanIns < 0 && high > 1) {

        high -= 1;
        low = high - 1;

        formation = [];

        for (let i = 0; i < rowCount; i++) {
          formation.push(
            i % 2 === 0 ? high : low
          );
        }

        total = formation.reduce(
          (a, b) => a + b,
          0
        );

        scanIns = count - total;
      }

      resultEl.innerHTML =
        `<span class="underline">${rowCount} Rows</span>` +
        `\nFormation: ${formation.join(" - ")}` +
        `\nScan In(s): ${scanIns}` +
        `\nAverage per row: ${avgDisplay}`;
    }


    function clearFormation() {

      const input = document.getElementById("studentCount");
      const resultEl = document.getElementById("result");
      const clearButton = document.getElementById("clearButton");

      input.value = "";
      resultEl.innerHTML = "";

      clearButton.style.display = "none";

      input.focus();
    }


    // Update formation instantly as the number is typed
    const input = document.getElementById("studentCount");

    input.addEventListener(
      "input",
      calculateFormation
    );


    // Prevent unwanted mobile keyboard scrolling
    window.scrollTo(0, 0);

    let userManuallyScrolled = false;

    window.addEventListener("scroll", () => {
      userManuallyScrolled = true;
    });

    const scrollInterval = setInterval(() => {

      if (!userManuallyScrolled) {
        window.scrollTo(0, 0);
      } else {
        clearInterval(scrollInterval);
      }

    }, 100);


    input.addEventListener("focus", () => {
      userManuallyScrolled = true;
    });


    input.addEventListener("blur", () => {

      setTimeout(() => {

        window.scrollTo(0, 0);

        userManuallyScrolled = false;

      }, 100);

    });

  </script>

</body>
</html>
